<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content — Gerard Irurre</title>
<meta name="description" content="Gerard Irurre — brand &amp; content designer, Barcelona. Brand identity, content, campaigns and social.">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;800;900&amp;family=Caveat:wght@500;700&amp;family=Space+Mono:wght@400;700&amp;display=swap">
<style>
body{margin:0;background:#EEEBE4}
a{color:inherit}a:hover{color:inherit}
.grain{position:absolute;inset:0;pointer-events:none;background-image:url(assets/e985e5adb271.png);background-repeat:repeat;opacity:.55;mix-blend-mode:multiply}
.t1{background:url(assets/0f13f55e5321.png) center/100% 100% no-repeat}
.tape1{background:url(assets/5d264df71453.png) center/100% 100% no-repeat}
.tape2{background:url(assets/e5c109c687ad.png) center/100% 100% no-repeat}
.nav a{text-decoration:none;padding:12px 0}
.nav a:hover,.nav a:focus,.nav a.on{text-decoration:underline;text-underline-offset:4px}
.clips{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:clamp(48px,5vw,72px) clamp(24px,3vw,44px)}
.clip{position:relative;display:block;text-decoration:none;color:#0E0E0E;transition:transform .35s ease}
.clip:hover,.clip:focus{transform:translateY(-6px) rotate(0deg) !important}
.next:hover .next-t,.next:focus .next-t{text-decoration:underline;text-decoration-thickness:4px}
.hero{position:relative;min-height:clamp(560px,52vw,780px)}
@media (max-width:760px){.hero-p{position:static !important;width:auto !important;margin:24px 0 0 !important;transform:none !important}}
</style>
<style>html:not(.dc-ready) #dc-root{visibility:hidden}</style>
</head>
<body>
<template id="dc-template">
<div style="position: relative; background: #EEEBE4; color: #0E0E0E; font-family: 'Archivo', system-ui, sans-serif; overflow: hidden;">

<header style="position: relative; z-index: 2; display: flex; flex-wrap: wrap; gap: 6px 28px; justify-content: space-between; align-items: center; padding: 8px clamp(16px, 3vw, 40px); font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em;">
<a href="index.html" style="text-decoration: none; padding: 12px 0;">Kodak Gold 200 &#160;▸ 02A &#160; Gerard Irurre — Issue 01</a>
<nav class="nav" aria-label="Main" style="display: flex; flex-wrap: wrap; gap: 4px 22px;">
<a href="brand.html">Brand</a><a class="on" href="content.html">Content</a><a href="campaigns.html">Campaigns</a><a href="social.html">Social</a><a href="index.html#contact">Contact</a>
</nav>
</header>

<section class="hero" aria-label="Content" style="max-width: 1440px; margin: 0 auto; padding: clamp(32px, 4vw, 56px) clamp(16px, 4vw, 56px) 0;">
<div class="grain" aria-hidden="true"></div>
<div style="position: relative; display: flex; justify-content: space-between; gap: 16px; padding: 6px 0; border-top: 2px solid #0E0E0E; border-bottom: 1px solid #0E0E0E; font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase;"><span>Kodak Gold 200 &#160;▸ 13</span><span>▸ 13A</span><span>Tri-X 400 &#160;▸ 14</span><span>Poster 02 — 04 entries</span></div>
<h1 style="position: relative; z-index: 2; margin: clamp(24px, 3vw, 40px) 0 0; transform: rotate(-3deg); transform-origin: left; font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(120px, 15vw, 230px); line-height: 0.8;">Content</h1>
<p style="position: relative; z-index: 2; margin: 18px 0 0; max-width: 380px; font-family: 'Space Mono', monospace; font-size: 12px; line-height: 1.6; text-transform: uppercase;">What I shoot and film — 35mm film, digital and reels. Rolls, trips and brands, over the years.</p>
<span class="hero-p" style="position: absolute; right: clamp(220px, 24vw, 360px); top: clamp(64px, 7vw, 100px); width: clamp(240px, 26vw, 380px); display: block; background: #FFFFFF; padding: 10px 10px 34px; transform: rotate(-4deg); box-shadow: 0 10px 26px rgba(14,14,14,0.2);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 50%; top: -14px; width: 100px; height: 30px; margin-left: -50px; transform: rotate(-3deg);"></span>
<img src="assets/2cd35c8fbeb9.jpg" alt="Basque coast, black and white" style="display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover;">
</span>
<span class="hero-p" style="position: absolute; right: clamp(16px, 4vw, 56px); top: clamp(200px, 20vw, 300px); width: clamp(200px, 20vw, 290px); display: block; background: #FFFFFF; padding: 10px 10px 30px; transform: rotate(6deg); box-shadow: 0 10px 26px rgba(14,14,14,0.22);">
<span class="tape2" aria-hidden="true" style="position: absolute; left: 50%; top: -14px; width: 92px; height: 28px; margin-left: -46px; transform: rotate(4deg);"></span>
<img src="assets/34a8ccc5c50b.jpg" alt="The Hermitage, black and white photocopy" style="display: block; width: 100%; aspect-ratio: 2 / 3; object-fit: cover;">
</span>
</section>

<main style="position: relative; max-width: 1440px; margin: 0 auto; padding: clamp(64px, 8vw, 120px) clamp(16px, 4vw, 56px);">
<div class="grain" aria-hidden="true"></div>
<div class="clips" style="position: relative;">
<sc-for list="{{clips}}" as="c" hint-placeholder-count="4">
<a class="clip" href="{{c.href}}" style="{{c.box}}">
<span class="{{c.tape}}" aria-hidden="true" style="position: absolute; left: 50%; top: -14px; width: 96px; height: 28px; margin-left: -48px; transform: rotate(-3deg); z-index: 1;"></span>
<span style="display: block; background: #FFFFFF; padding: 10px 10px 12px; box-shadow: 0 8px 22px rgba(14,14,14,0.16);">
<sc-if value="{{c.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{c.img}}" alt="{{c.alt}}" style="display: block; width: 100%; aspect-ratio: 4 / 5; object-fit: cover;"></sc-if>
<sc-if value="{{c.noImg}}" hint-placeholder-val="{{false}}"><span style="display: flex; align-items: center; justify-content: center; width: 100%; aspect-ratio: 4 / 5; background: #F4F1EA; font-family: 'Caveat', cursive; font-weight: 700; font-size: 28px; color: #8A8478;">[video still soon]</span></sc-if>
</span>
<span style="display: flex; justify-content: space-between; margin-top: 8px; font-family: 'Space Mono', monospace; font-size: 10px; text-transform: uppercase;"><span>▸ {{c.frame}}</span><span>{{c.film}}</span></span>
<span style="display: block; margin-top: 12px; font-weight: 900; font-size: clamp(28px, 2.6vw, 38px); line-height: 0.9; letter-spacing: -0.03em; text-transform: uppercase;">{{c.title}}</span>
<span style="display: block; margin-top: 10px; border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase;">
<span style="display: flex; justify-content: space-between; gap: 12px; padding: 6px 0; border-bottom: 1px solid #0E0E0E;"><span>Year</span><span>{{c.year}}</span></span>
<span style="display: flex; justify-content: space-between; gap: 12px; padding: 6px 0;"><span>Place</span><span style="text-align: right;">{{c.place}}</span></span>
</span>
<span style="display: block; margin-top: 10px; transform: rotate(-2deg); font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; line-height: 1.05; color: #C8321E;">{{c.note}}</span>
</a>
</sc-for>
</div>
</main>

<a class="next" href="campaigns.html" style="position: relative; display: block; height: clamp(150px, 15vw, 220px); margin: 0 -2%; text-decoration: none;">
<span class="t1" style="position: absolute; inset: 0; display: flex; align-items: center; justify-content: space-between; gap: 24px; padding: 0 clamp(24px, 5vw, 72px);">
<span style="font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase;">Next — Poster 03</span>
<span class="next-t" style="font-weight: 900; font-size: clamp(56px, 8vw, 120px); line-height: 0.8; letter-spacing: -0.045em; text-transform: uppercase;">Campaigns →</span>
</span>
</a>

<footer style="position: relative; display: flex; flex-wrap: wrap; gap: 8px 28px; justify-content: space-between; padding: 22px clamp(16px, 3vw, 40px) 32px; font-family: 'Space Mono', monospace; font-size: 11px; text-transform: uppercase;">
<a href="brand.html" style="text-decoration: none; padding: 12px 0;">← Poster 01 Brand</a>
<a href="mailto:girurre5@gmail.com" style="text-decoration: none; padding: 12px 0;">girurre5@gmail.com</a>
<span style="padding: 12px 0;">Barcelona — available now</span>
</footer>
</div>
</template>
<div id="dc-root"></div>
<script src="dc.js"></script>
<script>
class Component extends DCLogic {
  renderVals() {
    const B = 'assets/';
    const d = [
      { title: 'The Hermitage', year: '[year]', place: '[place]', frame: '1—27', film: '35mm b&w + colour', note: 'a wedding by the sea →', img: 'assets/64d8431a9b16.jpg', alt: 'The couple in an arched window over the sea', href: 'the-hermitage.html', r: -2 },
      { title: 'Basque Coast', year: '[year]', place: 'Euskadi', frame: '34', film: '35mm b&w + colour', note: 'van, cliffs, coast', img: 'assets/2cd35c8fbeb9.jpg', alt: 'Basque coast, black and white', href: 'content.html', r: -1 },
      { title: 'A Day in Lombok', year: '[year]', place: 'Indonesia', frame: '01—07', film: 'Reels', note: '7-part reel series', href: 'content.html', r: 3 },
      { title: 'KALIHU', year: '2019 — now', place: 'Product & lifestyle', frame: 'KH', film: 'Digital + film', note: 'product, lifestyle & video →', img: 'assets/6497032e0c04.jpg', alt: 'Surfers at dusk — KALIHU', href: 'content-kalihu.html', r: -3 }
    ];
    return { clips: d.map((x, i) => ({ ...x, tape: i % 2 ? 'tape2' : 'tape1', hasImg: !!x.img, noImg: !x.img, img: x.img || '', alt: x.alt || '',
      box: 'transform: rotate(' + x.r + 'deg);' + (i % 3 === 1 ? ' margin-top: clamp(0px, 4vw, 64px);' : '') })) };
  }
}
window.__DCComponent = Component;
</script>
</body>
</html>
