<script>
class Component extends DCLogic {
  renderVals() {
    const chips = [
      { name: 'Grey-blue', code: '#748B92 · [confirm]', bg: '#748B92', ph: '', r: -2 },
      { name: 'Green', code: '#6BBB76 · [confirm]', bg: '#6BBB76', ph: '', r: 1.5 },
      { name: '[colour 3]', code: '[hex]', bg: '#F4F1EA', ph: '[colour]', r: -1 },
      { name: '[colour 4]', code: '[hex]', bg: '#F4F1EA', ph: '[colour]', r: 2 }
    ];
    const apps = [
      { ph: '[business card]', cap: 'Business card', r: -3 },
      { ph: '[van]', cap: 'Van', r: 2.5 },
      { ph: '[uniform]', cap: 'Uniform', r: -1.5 },
      { img: 'assets/77d8c963ac8e.jpg', alt: 'The Jove Llar website', cap: 'Website', r: 2 }
    ];
    return {
      chips: chips.map(k => ({ ...k,
        box: 'background: #FFFFFF; padding: 8px 8px 14px; box-shadow: 0 6px 16px rgba(14,14,14,0.14); transform: rotate(' + k.r + 'deg);',
        sw: 'display: flex; align-items: center; justify-content: center; aspect-ratio: 1 / 1.15; background: ' + k.bg + '; border: 1px ' + (k.ph ? 'dashed' : 'solid') + ' rgba(14,14,14,0.3);' })),
      apps: apps.map((a, i) => ({ ...a, tape: i % 2 ? 'tape2' : 'tape1', hasImg: !!a.img, noImg: !a.img, img: a.img || '', alt: a.alt || '', ph: a.ph || '',
        box: 'flex: 0 1 300px; min-width: 0; transform: rotate(' + a.r + 'deg);' + (i % 2 === 1 ? ' margin-top: clamp(0px, 4vw, 64px);' : '') }))
    };
  }
}
window.__DCComponent = Component;
</script>
