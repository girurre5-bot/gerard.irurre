<style>

class Component extends DCLogic {

    const d = [
      { title: 'KALIHU × Maresme Waves', year: 'Nov 2025', type: 'Brand collab', result: '+40% sales · 200 pieces', note: 'capsule + 2 pop-ups →', img: 'assets/0881c818fc1b.jpg', alt: 'Guests at the pop-up', href: 'kalihu-x-maresme-waves.html', r: -2 },
