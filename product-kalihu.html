<style>
body{margin:0;background:#EEEBE4}
a{color:inherit}a:hover{color:inherit}
.grain{position:absolute;inset:0;pointer-events:none;background-image:url(assets/e985e5adb271.png);background-repeat:repeat;opacity:.55;mix-blend-mode:multiply}
.t2{background:url(assets/c73f49ea2a15.png) center/100% 100% no-repeat}
.vmeta{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:2px solid #0E0E0E;border-bottom:2px solid #0E0E0E;margin:0}
.vmeta div{padding:12px 14px 14px 0}
.vmeta dt{font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;color:#6A645A}
.vmeta dd{margin:6px 0 0;font-weight:700;font-size:15px;text-transform:uppercase;line-height:1.25}
.plabel{padding-top:8px;border-top:2px solid #0E0E0E}
@media (max-width:900px){.vmeta{grid-template-columns:repeat(2,minmax(0,1fr))}}
.t1{background:url(assets/0f13f55e5321.png) center/100% 100% no-repeat}
.nav a{text-decoration:none;padding:12px 0}
.nav a:hover,.nav a:focus,.nav a.on{text-decoration:underline;text-underline-offset:4px}
.mono{font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase}
.next:hover .next-t,.next:focus .next-t{text-decoration:underline;text-decoration-thickness:4px}
.pw{max-width:1440px;margin:0 auto;padding:0 clamp(16px,4vw,56px)}
.back{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:#E2DED5;font-weight:600;font-size:15px;text-decoration:none}
.back:hover{background:#D6D1C6}
.ph-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:32px clamp(24px,4vw,64px);align-items:start;margin-top:clamp(48px,6vw,96px)}
.ph-head h1{margin:0;font-weight:900;font-size:clamp(56px,7vw,112px);line-height:.85;letter-spacing:-0.04em;text-transform:uppercase}
.meta{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 32px}
.meta dt{font-weight:800;font-size:16px}
.meta dd{margin:6px 0 0;font-weight:500;font-size:15px;line-height:1.45;color:#6A645A}
.num{font-weight:500;font-size:clamp(56px,6vw,96px);line-height:.8;letter-spacing:-0.02em}
.lead{grid-column:2 / 4;max-width:760px}
.lead .mono{letter-spacing:.18em;color:#6A645A}
.lead p{margin:14px 0 0;font-weight:500;font-size:17px;line-height:1.6;color:#4A453E}
.piece{margin-top:clamp(80px,10vw,150px)}

.panel{background:#FFFFFF;display:grid;gap:clamp(16px,3vw,56px);padding:clamp(24px,5vw,88px);align-items:center;justify-items:center}

.panel.photos{padding:0;gap:clamp(8px,1vw,14px);background:transparent}
.panel.photos img{width:100%;max-height:none;aspect-ratio:4/5;object-fit:cover}
.empty{display:flex;align-items:center;justify-content:center;width:100%;aspect-ratio:4/5;background:#F4F1EA;border:1px dashed rgba(14,14,14,.3);font-family:'Caveat',cursive;font-weight:700;font-size:24px;color:#8A8478;text-align:center;box-sizing:border-box;padding:10px}

.links{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:18px}
.links a{font-weight:900;font-size:clamp(18px,1.8vw,24px);text-transform:uppercase;letter-spacing:-.02em;text-decoration:none;border-bottom:3px solid #0E0E0E}
.links a:hover{color:#C8321E;border-color:#C8321E}
@media (max-width:900px){.ph-head{grid-template-columns:1fr}.lead{grid-column:1}.meta{grid-template-columns:1fr 1fr}.num{display:none}.panel{grid-template-columns:1fr!important}}

.prints{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(40px,5vw,72px) clamp(24px,3vw,48px);align-items:start}
.pcard{position:relative;display:block;width:100%;margin:0;padding:10px 10px 40px;border:0;background:#FFFFFF;box-shadow:0 10px 26px rgba(14,14,14,.18);cursor:pointer;font:inherit;color:#0E0E0E;text-align:left;transition:transform .3s ease}
.pcard:hover,.pcard:focus{transform:translateY(-6px) rotate(0deg)!important}
.pcard img,.pcard .empty{display:flex;width:100%;aspect-ratio:3/4;object-fit:cover}
.pcard .nm{position:absolute;left:12px;right:12px;bottom:10px;display:flex;justify-content:space-between;font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase}
.pcard[aria-pressed="true"]{outline:3px solid #C8321E;outline-offset:4px}
.detail{margin-top:clamp(56px,7vw,104px)}
.detail .two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(12px,1.4vw,20px)}
.detail .cell{position:relative;background:transparent;display:flex;align-items:center;justify-content:center;aspect-ratio:1/1;padding:clamp(20px,4vw,64px);box-sizing:border-box}
.detail .cell img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.detail .cell .empty{width:100%;height:100%;aspect-ratio:auto}
.detail .tag{position:absolute;left:14px;bottom:12px;font-family:'Space Mono',monospace;font-size:10px;text-transform:uppercase;color:#6A645A}
.detail .life{position:relative;margin-top:clamp(12px,1.4vw,20px);background:#FFFFFF}
.detail .life img,.detail .life .empty{display:flex;width:100%;aspect-ratio:16/9;object-fit:cover}
.rowblk+.rowblk{margin-top:clamp(28px,3vw,44px)}
.rlab{margin:0 0 10px;color:#6A645A}
.rowafter{margin-top:clamp(40px,5vw,72px)!important}
.gal{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:clamp(10px,1.2vw,18px);margin-top:28px}
.gal figure{margin:0}
.gal img,.gal .empty{display:flex;width:100%;height:100%;aspect-ratio:4/5;object-fit:cover}
.gal .big{grid-column:span 2;grid-row:span 2}
.gal .big img,.gal .big .empty{aspect-ratio:auto;min-height:100%}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,minmax(0,1fr))}}
.closex{border:0;background:transparent;font-family:'Space Mono',monospace;font-size:11px;text-transform:uppercase;cursor:pointer;padding:6px 0;text-decoration:underline;text-underline-offset:3px}
@media (max-width:900px){.prints{grid-template-columns:repeat(2,minmax(0,1fr))}.detail .two{grid-template-columns:1fr}}
</style>

<section class="pw" aria-label="The pieces" style="margin-top: clamp(72px, 9vw, 130px);">

<div class="prints" style="margin-top: 36px;">
<sc-for list="{{pieces}}" as="c" hint-placeholder-count="6">
<button type="button" class="pcard" onClick="{{c.pick}}" aria-pressed="{{c.pressed}}" aria-label="{{c.aria}}" style="{{c.box}}">
<span class="{{c.tape}}" aria-hidden="true" style="position: absolute; left: 50%; top: -14px; width: 90px; height: 26px; margin-left: -45px; z-index: 1;"></span>
<sc-if value="{{c.hasImg}}" hint-placeholder-val="{{true}}"><img src="{{c.img}}" alt="{{c.alt}}"></sc-if>
<sc-if value="{{c.noImg}}" hint-placeholder-val="{{false}}"><span class="empty">[{{c.low}} photo]</span></sc-if>
<span class="nm"><span>{{c.name}}</span><span>{{c.state}}</span></span>
</button>
</sc-for>
</div>

<sc-if value="{{hasCur}}" hint-placeholder-val="{{true}}">
<div class="detail" id="piece-open">
<div class="plabel"><b>{{cur.name}}</b><span>{{cur.line}} &nbsp; <button type="button" class="closex" onClick="{{close}}">close ×</button></span></div>
<sc-for list="{{cur.rows}}" as="r" hint-placeholder-count="2">
<div class="rowblk">
<sc-if value="{{r.hasTitle}}" hint-placeholder-val="{{true}}"><p class="mono rlab">{{r.title}}</p></sc-if>
<div class="two">
<div class="cell"><sc-if value="{{r.hasL}}" hint-placeholder-val="{{true}}"><img src="{{r.l}}" alt="{{r.lAlt}}"></sc-if><sc-if value="{{r.noL}}" hint-placeholder-val="{{false}}"><span class="empty">{{r.lPh}}</span></sc-if><span class="tag">{{r.lTag}}</span></div>
<div class="cell"><sc-if value="{{r.hasR}}" hint-placeholder-val="{{true}}"><img src="{{r.r}}" alt="{{r.rAlt}}"></sc-if><sc-if value="{{r.noR}}" hint-placeholder-val="{{false}}"><span class="empty">{{r.rPh}}</span></sc-if><span class="tag">{{r.rTag}}</span></div>
</div>
</div>
</sc-for>

<sc-for list="{{cur.after}}" as="r" hint-placeholder-count="1">
<div class="rowblk rowafter">
<sc-if value="{{r.hasTitle}}" hint-placeholder-val="{{true}}"><p class="mono rlab">{{r.title}}</p></sc-if>
<div class="two">
<div class="cell"><sc-if value="{{r.hasL}}" hint-placeholder-val="{{true}}"><img src="{{r.l}}" alt="{{r.lAlt}}"></sc-if><sc-if value="{{r.noL}}" hint-placeholder-val="{{false}}"><span class="empty">{{r.lPh}}</span></sc-if><span class="tag">{{r.lTag}}</span></div>
<div class="cell"><sc-if value="{{r.hasR}}" hint-placeholder-val="{{true}}"><img src="{{r.r}}" alt="{{r.rAlt}}"></sc-if><sc-if value="{{r.noR}}" hint-placeholder-val="{{false}}"><span class="empty">{{r.rPh}}</span></sc-if><span class="tag">{{r.rTag}}</span></div>

<script src="dc.js"></script>
<script>
class Component extends DCLogic {
  constructor(p) { super(p); this.state = { open: 0 }; }
  renderVals() {
    const B = 'assets/';
    const P = [
      { name: 'Tee', img: 'assets/5eb4765a4c86.jpg', alt: 'KALIHU t-shirt on the beach',
        rows: [
          { title: 'Classic logo', l: 'assets/8b6ec03416aa.png', lAlt: 'Classic logo tee, front: small octagon logo on the chest', lTag: 'Front', r: 'assets/1ae895af9f17.png', rAlt: 'Classic logo tee, back: large KALIHU Surf Community octagon', rTag: 'Back' },
          { after: true, title: 'Sweet square — second tee', l: 'assets/3c21b91f1746.png', lAlt: 'Sweet square tee, front: outlined KALIHU on the chest', lTag: 'Front', r: 'assets/3b27de57b0f4.png', rAlt: 'Sweet square tee, back: the K and vertical KALIHU in a square, Community of Maresme surfers', rTag: 'Back' }
        ] },
      { name: 'Pants' },
      { name: 'Boardshorts' },
      { name: 'Cap', img: 'assets/63561c77bd31.jpg', alt: 'KALIHU trucker cap on a coconut', life: 'assets/63561c77bd31.jpg' },
      { name: 'Beanie' },
      { name: 'Socks', img: 'assets/cf13c2a05095.jpg', alt: 'Six KALIHU socks', mock: 'assets/cf13c2a05095.jpg' }
    ];
    const rots = [-2.5, 2, -1, 1.5, -2, 2.5];
    const open = this.state.open;
    const c = open === null ? null : P[open];
    const pick = i => () => { this.setState({ open: i }); setTimeout(() => { const el = document.getElementById('piece-open'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' }); }, 60); };
    const mapRow = c => r => ({ title: r.title || '', hasTitle: !!r.title,
      l: r.l || '', hasL: !!r.l, noL: !r.l, lAlt: r.lAlt || (c.name + ' mockup'), lTag: r.lTag, lPh: '[' + c.name.toLowerCase() + ' — ' + r.lTag.toLowerCase() + ']',
      r: r.r || '', hasR: !!r.r, noR: !r.r, rAlt: r.rAlt || (c.name + ' design'), rTag: r.rTag, rPh: '[' + c.name.toLowerCase() + ' — ' + (r.rTag === 'Design' ? 'the design' : r.rTag.toLowerCase()) + ']' });
    return {
      count: String(P.length).padStart(2, '0') + ' pieces',
      pieces: P.map((x, i) => ({ name: x.name, low: x.name.toLowerCase(), img: x.img || '', alt: x.alt || '', hasImg: !!x.img, noImg: !x.img,
        tape: i % 2 ? 'tape2' : 'tape1', pressed: i === open ? 'true' : 'false', state: i === open ? 'open ✓' : 'open +',
        aria: 'Open ' + x.name, pick: pick(i),
        box: 'transform: rotate(' + rots[i % 6] + 'deg);' + (i % 3 === 1 ? ' margin-top: clamp(0px, 4vw, 56px);' : '') })),
      hasCur: !!c,
      close: () => this.setState({ open: null }),
      cur: c ? { name: c.name, low: c.name.toLowerCase(), line: c.line || (c.rows ? '[fabric · technique]' : '[fabric · technique · colours]'),
        rows: (c.rows || [{ title: '', l: c.mock || '', lTag: 'Mockup', r: c.design || '', rTag: 'Design' }]).filter(r => !r.after).map(mapRow(c)),
        after: (c.rows || []).filter(r => r.after).map(mapRow(c)),
        mock: c.mock || '', hasMock: !!c.mock, noMock: !c.mock,
        design: c.design || '', hasDesign: !!c.design, noDesign: !c.design,
        life: c.life || '', hasLife: !!c.life, noLife: !c.life } : { name: '', low: '', line: '', mock: '', hasMock: false, noMock: true, design: '', hasDesign: false, noDesign: true, life: '', hasLife: false, noLife: true, rows: [], after: [] }
    };
  }
}
window.__DCComponent = Component;
</script>
