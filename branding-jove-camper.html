<p style="position: relative; margin: clamp(28px, 3vw, 44px) 0 0; max-width: 820px; font-weight: 600; font-size: clamp(19px, 1.8vw, 25px); line-height: 1.4;">A campervan rental planned from El Masnou, on the Maresme — 20 minutes from Barcelona, 20 from the Costa Brava. In October 2025 it got a business plan, the numbers and a first brand. It stayed a plan. My part: the brand and the marketing.</p>

<!-- CHALLENGE / IDEA -->
<section style="position: relative; max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px) clamp(64px, 8vw, 120px);">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E;">
<div style="padding: 20px clamp(0px, 2vw, 32px) 28px 0;">
<p class="mono" style="margin: 0 0 12px;">The challenge</p>
<p style="margin: 0; font-weight: 900; font-size: clamp(30px, 3.2vw, 48px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">On Yescapa, most vans belong to private owners. Same price, no brand.</p>
</div>
<div style="padding: 20px 0 28px clamp(0px, 2vw, 32px);">
<p class="mono" style="margin: 0 0 12px;">The idea</p>
<p style="margin: 0; font-weight: 900; font-size: clamp(30px, 3.2vw, 48px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">Private-owner prices, a real company’s look. A van that feels like a home.</p>
</div>
</div>
</section>
<!-- SHEETS 01 + 02 -->
<section style="position: relative; max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px) clamp(64px, 8vw, 120px); display: flex; flex-wrap: wrap; gap: 64px clamp(32px, 4vw, 64px); align-items: flex-start;">
<div class="grain" aria-hidden="true"></div>
<article class="sheet" style="flex: 1 1 480px; min-width: 0; transform: rotate(-1.2deg);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 50%; top: -16px; width: 120px; height: 34px; margin-left: -60px; transform: rotate(-3deg);"></span>
<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 01</span><span>Positioning</span></p>
<h2 style="margin: 28px 0 18px; font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(48px, 4.6vw, 68px); line-height: 0.9;">What Jove Camper is</h2>
<div style="border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-weight: 600; font-size: 17px; line-height: 1.35;">
<div class="prow"><span class="mono" style="padding-top: 3px;">For</span><span>20 to 35 — couples, solo, or three friends — who want a couple of days in nature, away from the city.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Where</span><span>El Masnou, Maresme. Mountain or beach in 20 minutes, Barcelona and the Costa Brava either side.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Why rent with us</span><span>A private owner’s price, around €100 a night — with the image and the care of a proper company.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Looks like</span><span>Every van the same: matte black outside, white or orange vinyl, warm wood inside.</span></div><div class="prow" style="border-bottom: 0;"><span class="mono" style="padding-top: 3px;">Not</span><span>The industrial white rental van.</span></div>
</div>
</article>
<article class="sheet" style="flex: 1 1 440px; min-width: 0; margin-top: clamp(0px, 6vw, 96px); transform: rotate(1.2deg);">
<span class="tape2" aria-hidden="true" style="position: absolute; left: 50%; top: -16px; width: 120px; height: 34px; margin-left: -60px; transform: rotate(3deg);"></span>
<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 02</span><span>Research</span></p>
<p style="margin: 28px 0 0; font-weight: 900; font-size: clamp(28px, 2.8vw, 40px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">More people want a van. Fewer can keep one.</p>
<div style="margin-top: 22px; border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-weight: 600; font-size: 16px; line-height: 1.35;">
<div class="prow"><span class="mono" style="padding-top: 3px;">Competition</span><span>Campermobil · Indie Campers · Migratevan · Life on Road</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Reference</span><span>@ridercampers — a rental with its own look.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Channels</span><span>Yescapa, PaulCamper, Covey — big platforms first, our own site later.</span></div><div class="prow" style="border-bottom: 0;"><span class="mono" style="padding-top: 3px;">Price</span><span>Around €100 a night: €90 low season, €110 high.</span></div>
</div>
<p class="hand" style="margin: 18px 0 0; font-size: 26px; transform: rotate(-1.5deg);">same price as everyone — so the brand has to do the work.</p>
</article>
</section>
<!-- SHEETS 03 + 04 -->
<section style="position: relative; max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px) clamp(64px, 8vw, 120px); display: flex; flex-wrap: wrap; gap: 64px clamp(32px, 4vw, 64px); align-items: flex-start;">
<div class="grain" aria-hidden="true"></div>
<article class="sheet" style="flex: 1 1 420px; min-width: 0; transform: rotate(-1deg);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 50%; top: -16px; width: 120px; height: 34px; margin-left: -60px; transform: rotate(-3deg);"></span>
<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 03</span><span>The numbers — on paper</span></p>
<p style="margin: 28px 0 0; font-weight: 900; font-size: clamp(28px, 2.8vw, 40px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">One van first. Prove it, then grow.</p>
<div style="margin-top: 22px; border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-weight: 600; font-size: 16px; line-height: 1.35;">
<div class="prow"><span class="mono" style="padding-top: 3px;">Start</span><span>One van, around €25,000 all-in: van, paint, vinyl, insurance, first marketing.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Plan</span><span>Weekends, bank holidays and long weekends — about 141 nights a year.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Break-even</span><span>About 33 nights a year, on paper.</span></div><div class="prow" style="border-bottom: 0;"><span class="mono" style="padding-top: 3px;">Then</span><span>A second van once the reviews and bookings are steady.</span></div>
</div>
<p class="hand" style="margin: 18px 0 0; font-size: 24px; transform: rotate(-1.5deg);">projections — the van was never bought.</p>
</article>
<div style="flex: 1 1 520px; min-width: 0;">
<p class="mono" style="margin: 0 0 8px; display: flex; justify-content: space-between; border-bottom: 2px solid #0E0E0E; padding-bottom: 8px;"><span>Sheet 04</span><span>Marketing ideas</span></p>
<div class="lined" style="position: relative; box-sizing: border-box; margin-top: 36px; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(-1.2deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 24px; top: -12px; width: 84px; height: 24px; transform: rotate(-4deg);"></span>
<p style="margin: 0; padding-top: 10px; font-weight: 900; font-size: 26px; line-height: 47px; letter-spacing: -0.02em; text-transform: uppercase;">Make them fall for the van <span style="font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; text-transform: none; letter-spacing: 0; color: #6A645A;">— not just rent it</span></p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;">a map on the inside wall — every renter marks where they went.</p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;"><span style="color: #6A645A;">→ the van carries its own story, and they want to come back.</span></p>
</div>
<div class="lined" style="position: relative; box-sizing: border-box; margin-top: 36px; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(1deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);">
<span class="tape2" aria-hidden="true" style="position: absolute; left: 24px; top: -12px; width: 84px; height: 24px; transform: rotate(-4deg);"></span>
<p style="margin: 0; padding-top: 10px; font-weight: 900; font-size: 26px; line-height: 47px; letter-spacing: -0.02em; text-transform: uppercase;">Let renters tell it <span style="font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; text-transform: none; letter-spacing: 0; color: #6A645A;">— their videos, our feed</span></p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;">renters’ clips reposted on our socials — real trips sell the trip.</p>
</div>
<div class="lined" style="position: relative; box-sizing: border-box; margin-top: 36px; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(-0.6deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 24px; top: -12px; width: 84px; height: 24px; transform: rotate(-4deg);"></span>
<p style="margin: 0; padding-top: 10px; font-weight: 900; font-size: 26px; line-height: 47px; letter-spacing: -0.02em; text-transform: uppercase;">Small things to keep <span style="font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; text-transform: none; letter-spacing: 0; color: #6A645A;">— merch</span></p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;">tees · keyrings · stickers — so the brand leaves with them.</p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;"><span style="color: #6A645A;">+ a free weekend for creators, in exchange for the content.</span></p>
</div>
