<p style="margin: 0; font-weight: 600; font-size: clamp(20px, 1.9vw, 27px); line-height: 1.35;">KALIHU is a call to switch off and get back the analogue spirit of the 80s — a street brand, made to last, rooted in road-trip surf, real skate and the Maresme community. The identity had to look like that: old school with a punk edge, mostly black and white, one hit of orange.</p>
<p style="margin: 18px 0 0;"><a href="branding-kalihu.html" class="mono" style="text-underline-offset: 4px;">The story behind the name →</a></p>
</div>

<div class="row"><dt>For</dt><dd style="margin: 0; text-align: right;">Surf &amp; skate, 15 — 40</dd></div>
<div class="row"><dt>Attitude</dt><dd style="margin: 0; text-align: right;">Old school · punk · Dickies, Vans, Zippo</dd></div>
<div class="row" style="border-bottom: 2px solid #0E0E0E;"><dt>Role</dt><dd style="margin: 0; text-align: right;">Logo · colour · type · hangtags · packaging</dd></div>
</dl>
</section>

</article>

<p style="margin: 12px 0 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; font-size: 16px; line-height: 1.45;">Clean, stable and legible. Labels, technical info, web and everyday communication.</p>

<script>
class Component extends DCLogic {
  renderVals() {
    const B = 'assets/';
    const chips = [
      { name: 'Negre Kalihu', code: '#231F20', rgb: '35 31 32', bg: '#231F20', use: 'backgrounds, text, logo', r: -2 },
