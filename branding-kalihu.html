<!-- INTRO -->
<section style="position: relative; max-width: 1440px; margin: 0 auto; padding: clamp(56px, 7vw, 104px) clamp(16px, 4vw, 56px) clamp(40px, 5vw, 72px); display: flex; flex-wrap: wrap; gap: 40px clamp(32px, 5vw, 80px);">
<div class="grain" aria-hidden="true"></div>
<p style="position: relative; flex: 1.3 1 420px; min-width: 0; margin: 0; font-weight: 600; font-size: clamp(20px, 1.9vw, 27px); line-height: 1.35;">KALIHU is a surf apparel brand from the Maresme, the stretch of coast north of Barcelona. I've been its designer since day one — and before any logo or garment, the work was the brand itself: the name, the idea, who it's for and how it speaks.</p>
<dl style="position: relative; flex: 1 1 340px; min-width: 0; margin: 0; border-top: 2px solid #0E0E0E; font-weight: 600; font-size: 15px; text-transform: uppercase;">

<div class="row" style="border-bottom: 2px solid #0E0E0E;"><dt>Role</dt><dd style="margin: 0; text-align: right;">Naming · platform · positioning · tone</dd></div>
</dl>
</section>

<p class="mono" style="margin: 0 0 12px;">The challenge</p>
<p style="margin: 0; font-weight: 900; font-size: clamp(30px, 3.2vw, 48px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">Surfers in the Maresme wore industrial brands — no personality, no message.</p>
</div>
<div style="padding: 20px 0 28px clamp(0px, 2vw, 32px);">
<p class="mono" style="margin: 0 0 12px;">The idea</p>
<p style="margin: 0; font-weight: 900; font-size: clamp(30px, 3.2vw, 48px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">A brand that unites the Maresme surf scene — and makes you feel part of it.</p>
</div>
</div>
</section>

<!-- 01 NAMING -->
<article class="sheet" style="flex: 1 1 520px; min-width: 0; transform: rotate(-1.2deg);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 50%; top: -16px; width: 120px; height: 34px; margin-left: -60px; transform: rotate(-3deg);"></span>
<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 01</span><span>Naming</span></p>
<div style="margin-top: clamp(40px, 5vw, 64px); font-weight: 900; font-size: clamp(64px, 7.4vw, 112px); line-height: 0.85; letter-spacing: -0.04em; text-transform: uppercase; white-space: nowrap;">
<span style="position: relative; display: inline-block;"><span class="strike">C</span><span class="hand" style="position: absolute; left: 4%; top: -0.62em; font-size: 0.72em; letter-spacing: 0; transform: rotate(-6deg);">K</span></span>ALI<span style="position: relative; display: inline-block; width: 0;"><span class="hand" style="position: absolute; left: -0.08em; top: -0.62em; font-size: 0.5em; letter-spacing: 0; white-space: nowrap; transform: rotate(-4deg);">+H</span></span>U
</div>
<p style="margin: 22px 0 0; font-weight: 600; font-size: 17px; line-height: 1.45;"><b style="font-weight: 900;">caliu</b> <span class="mono">(Catalan, n.)</span> — the warmth of embers after the fire. Also: human warmth, comfort, being close. <i>Fer caliu</i> — to gather round, like brothers.</p>
<div style="display: flex; flex-wrap: wrap; gap: 24px; align-items: center; margin-top: 28px; padding-top: 20px; border-top: 1px solid #0E0E0E;">
<img src="assets/5bd98d3e7af3.jpg" alt="KALIHU logo — hand-lettered wordmark in a hexagonal badge" style="display: block; width: clamp(150px, 15vw, 210px); transform: rotate(2deg);">
<ul style="flex: 1 1 200px; margin: 0; padding: 0; list-style: none; font-family: 'Caveat', cursive; font-weight: 700; font-size: 25px; line-height: 1.15; color: #C8321E;">
<li>C → K: the logo drawing already looked like a K</li>
<li style="margin-top: 8px;">+ H: to sound more international</li>
</ul>
</div>
<div style="margin-top: 28px; padding-top: 14px; border-top: 1px solid #0E0E0E;">
<p class="mono" style="margin: 0 0 10px;">Also on the table</p>
<p style="margin: 0; display: flex; flex-wrap: wrap; gap: 10px 32px; align-items: baseline; font-weight: 900; font-size: clamp(32px, 3vw, 44px); letter-spacing: -0.03em; text-transform: uppercase; color: #6E6A62;"><span class="strike">Jelly</span><span class="strike">Kups</span><span class="hand" style="font-size: 26px; text-transform: none; letter-spacing: 0;">no warmth in them</span></p>
</div>
</article>

<!-- 02 PLATFORM -->
<article class="sheet" style="flex: 1 1 480px; min-width: 0; margin-top: clamp(0px, 6vw, 96px); transform: rotate(1.4deg);">

<h2 style="margin: 28px 0 18px; font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(48px, 4.6vw, 68px); line-height: 0.9;">What KALIHU is</h2>
<div style="border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-weight: 600; font-size: 17px; line-height: 1.35;">
<div class="prow"><span class="mono" style="padding-top: 3px;">For</span><span>The Maresme surfer, tired of industrial brands with no personality and no message.</span></div>
<div class="prow"><span class="mono" style="padding-top: 3px;">Purpose</span><span>Unite the surf world of the Maresme.</span></div>
<div class="prow"><span class="mono" style="padding-top: 3px;">Why wear it</span><span>For what it stands for — and to feel part of a minority: the few who surf this coast.</span></div>
<div class="prow"><span class="mono" style="padding-top: 3px;">Values</span><span style="font-weight: 900; text-transform: uppercase; letter-spacing: -0.01em;">Caliu · Freedom · Rebel energy · Nostalgia</span></div>
<div class="prow"><span class="mono" style="padding-top: 3px;">Personality</span><span>Old-school, a little melancholic. Back when everything felt better.</span></div>
<div class="prow" style="border-bottom: 0;"><span class="mono" style="padding-top: 3px;">Not</span><span>Industrial. Faceless. Saying nothing.</span></div>
</div>
<p class="hand" style="margin: 16px 0 0; transform: rotate(-2deg); font-size: 28px;">a brand you wear for its ideals ↑</p>
</article>

<img src="assets/5eb4765a4c86.jpg" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(1) contrast(1.25) brightness(0.8);">

<div>
<p style="margin: 0; font-weight: 900; font-size: clamp(64px, 7vw, 104px); line-height: 0.82; letter-spacing: -0.05em; text-transform: uppercase;">Fer<br>caliu.</p>
<p style="margin: 14px 0 0; max-width: 300px; font-weight: 800; font-size: 16px; line-height: 1.25; text-transform: uppercase;">For the few who surf the Maresme. Warm water's not guaranteed — the people are.</p>

<script>
class Component extends DCLogic {
  renderVals() {
    const tone = [
      { word: 'Warm', line: 'like a mate at the beach, not a shop', say: '[a real KALIHU caption]', never: '[what an industrial brand would say]', r: -1.5 },
      { word: 'Nostalgic', line: 'old photos, old type, a bit of melancholy', say: '[a real KALIHU caption]', never: '[trend-chasing hype]', r: 1.2 },
      { word: 'Rebel', line: 'a minority, and proud of it', say: '[a real KALIHU caption]', never: '[corporate, safe, for everyone]', r: -0.8 }
    ];
    const archive = [
      { ph: '[first sketches]', cap: 'Sketchbook', r: -3 },
      { ph: '[logo drafts]', cap: 'The K that started it', r: 2.5 },
      { ph: '[early moodboard]', cap: 'References', r: -1.5 }
    ];
    return {
      tone: tone.map((t, i) => ({ ...t, tape: i % 2 ? 'tape2' : 'tape1',
        box: 'position: relative; box-sizing: border-box; margin-top: ' + (i ? '40px' : '28px') + '; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(' + t.r + 'deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);' })),
      archive: archive.map((a, i) => ({ ...a, tape: i % 2 ? 'tape2' : 'tape1',
        box: 'flex: 0 1 300px; min-width: 0; transform: rotate(' + a.r + 'deg);' + (i === 1 ? ' margin-top: clamp(0px, 4vw, 64px);' : '') }))
    };
  }
}
window.__DCComponent = Component;
</script>
