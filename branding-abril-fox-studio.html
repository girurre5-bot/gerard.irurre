<p class="mono" style="margin: 0 0 12px;">The idea</p>
<p style="margin: 0; font-weight: 900; font-size: clamp(30px, 3.2vw, 48px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">A couple documenting couples.</p>

<section style="position: relative; max-width: 1440px; margin: 0 auto; padding: 0 clamp(16px, 4vw, 56px) clamp(64px, 8vw, 120px); display: flex; flex-wrap: wrap; gap: 64px clamp(32px, 4vw, 64px); align-items: flex-start;">

<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 01</span><span>Naming</span></p>
<div style="margin-top: clamp(40px, 5vw, 64px); font-weight: 900; font-size: clamp(48px, 5.4vw, 84px); line-height: 0.85; letter-spacing: -0.04em; text-transform: uppercase;">Abril Fox Studio</div>
<p style="margin: 22px 0 0; font-weight: 600; font-size: 17px; line-height: 1.45;"><b style="font-weight: 900;">Abril Fox</b> is Abril’s real name. It reads like an author’s signature — the way the best photographers sign — sounds the same in any language, and “Fox” has something elegant and a little wild. Its weak point: it’s only her name, and we’re a duo. So we kept it whole and added <b style="font-weight: 900;">Studio</b> to make room for the team.</p>
<div style="margin-top: 28px; padding-top: 14px; border-top: 1px solid #0E0E0E;">
<p class="mono" style="margin: 0 0 10px;">Also on the table</p>
<p style="margin: 0; font-weight: 600; font-size: 16px; line-height: 1.6; color: #6A645A;"><s style="text-decoration-color: #C8321E;">Atelier Abril</s> · <s style="text-decoration-color: #C8321E;">Casa Abril</s> · <s style="text-decoration-color: #C8321E;">Maison Fox</s> · <s style="text-decoration-color: #C8321E;">Albor</s> · <s style="text-decoration-color: #C8321E;">Mirador</s> · <s style="text-decoration-color: #C8321E;">Meridiana</s> · <s style="text-decoration-color: #C8321E;">Aurea</s> · <s style="text-decoration-color: #C8321E;">Linen &amp; Light</s> · <s style="text-decoration-color: #C8321E;">Abril &amp; Gerard</s></p>
<p class="hand" style="margin: 14px 0 0; font-size: 24px; transform: rotate(-1deg);">“Fox” alone? too used — hard to register, impossible to google.</p>
</div>
</article>
<article class="sheet" style="flex: 1 1 480px; min-width: 0; margin-top: clamp(0px, 6vw, 96px); transform: rotate(1.4deg);">
<span class="tape2" aria-hidden="true" style="position: absolute; left: 50%; top: -16px; width: 120px; height: 34px; margin-left: -60px; transform: rotate(3deg);"></span>
<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 02</span><span>Positioning</span></p>
<h2 style="margin: 28px 0 18px; font-family: 'Caveat', cursive; font-weight: 700; font-size: clamp(48px, 4.6vw, 68px); line-height: 0.9;">What Abril Fox Studio is</h2>
<div style="border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-weight: 600; font-size: 17px; line-height: 1.35;">
<div class="prow"><span class="mono" style="padding-top: 3px;">For</span><span>International couples with an editorial eye — destination weddings in Barcelona, with a network in Australia and Argentina.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Idea</span><span>A couple documenting couples — with a designer’s eye and an international story: Barcelona, Argentina, Australia.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Why book us</span><span>Photo + film in one look · a “home video” film on Handycam · the Fuji as a second eye, “The Party Roll” · art direction · English, Spanish, Catalan · sneak peek in 48 h.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">Feels like</span><span>Calm confidence · creative authority · elegance · warmth.</span></div><div class="prow" style="border-bottom: 0;"><span class="mono" style="padding-top: 3px;">Not</span><span>Beige and gold. Thin serif + script. Monograms in a circle. Flowers, crowns, diamonds. Pinterest.</span></div>
</div>
</article>

<p class="mono" style="margin: 0; display: flex; justify-content: space-between;"><span>Sheet 03</span><span>Research</span></p>
<p style="margin: 28px 0 0; font-weight: 900; font-size: clamp(28px, 2.8vw, 40px); line-height: 0.95; letter-spacing: -0.03em; text-transform: uppercase;">A market split in two.</p>
<div style="margin-top: 22px; border-top: 2px solid #0E0E0E; border-bottom: 2px solid #0E0E0E; font-weight: 600; font-size: 16px; line-height: 1.35;">
<div class="prow"><span class="mono" style="padding-top: 3px;">Local</span><span>Saturated and cheap — €800–2,500 per photographer.</span></div><div class="prow"><span class="mono" style="padding-top: 3px;">International</span><span>€3,000–5,000+. “Luxury editorial” in Barcelona reaches $6,500–7,000.</span></div><div class="prow" style="border-bottom: 0;"><span class="mono" style="padding-top: 3px;">How they choose</span><span>By image — Instagram and the website, in ten seconds.</span></div>
</div>
<p class="hand" style="margin: 18px 0 0; font-size: 26px; transform: rotate(-1.5deg);">everyone says “timeless, editorial, candid”. that’s the gap.</p>
</article>
<div style="flex: 1 1 520px; min-width: 0;">
<p class="mono" style="margin: 0 0 8px; display: flex; justify-content: space-between; border-bottom: 2px solid #0E0E0E; padding-bottom: 8px;"><span>Sheet 04</span><span>The turn</span></p>
<div class="lined" style="position: relative; box-sizing: border-box; margin-top: 28px; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(-1.2deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);">

<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;"><span style="text-decoration: line-through; text-decoration-color: #C8321E; text-decoration-thickness: 2px; color: #6A645A;">The Edited House · The Long Line · Persiana</span></p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 25px; line-height: 47px; color: #C8321E;">none of them was it.</p>
</div>
<div class="lined" style="position: relative; box-sizing: border-box; margin-top: 40px; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(1deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);">

<p style="margin: 0; padding-top: 10px; font-weight: 900; font-size: 26px; line-height: 47px; letter-spacing: -0.02em; text-transform: uppercase;">The feedback</p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 700; font-size: 26px; line-height: 47px;">“we want a logo with style, minimal, for people with class.”</p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px; color: #6A645A;">→ the whole brand turned to quiet luxury.</p>
</div>
<div class="lined" style="position: relative; box-sizing: border-box; margin-top: 40px; padding: 0 clamp(18px, 2.4vw, 28px) 4px; transform: rotate(-0.6deg); box-shadow: 0 10px 24px rgba(14,14,14,0.14);">
<span class="tape1" aria-hidden="true" style="position: absolute; left: 24px; top: -12px; width: 84px; height: 24px; transform: rotate(-4deg);"></span>
<p style="margin: 0; padding-top: 10px; font-weight: 900; font-size: 26px; line-height: 47px; letter-spacing: -0.02em; text-transform: uppercase;">The system <span style="font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; text-transform: none; letter-spacing: 0; color: #6A645A;">— four voices</span></p>
<p style="margin: 0; font-family: 'Caveat', cursive; font-weight: 500; font-size: 24px; line-height: 47px;">the name · our signature, “Abril y Gerard” · “with love” · the place.</p>
