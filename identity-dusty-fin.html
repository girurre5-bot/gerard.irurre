<script>
class Component extends DCLogic {
  renderVals() {
    const chips = [
      { name: 'Obsidian black', code: '#1A1A1B', bg: '#1A1A1B', r: -2 },
      { name: 'Off-white sand', code: '#F1EEDF', bg: '#F1EEDF', r: 1.5 },
      { name: 'Outback rust', code: '#E87722', bg: '#E87722', r: -1 },
      { name: 'Dusty lavender', code: '#6A5ACD', bg: '#6A5ACD', r: 2 }
    ];
    const apps = [
      { ph: '[website]', cap: 'Web', r: -3 },
      { ph: '[instagram]', cap: 'Social', r: 2.5 },
      { ph: '[merch / stickers]', cap: 'Merch', r: -1.5 }
    ];
    return {
      chips: chips.map(k => ({ ...k,
        box: 'background: #FFFFFF; padding: 8px 8px 14px; box-shadow: 0 6px 16px rgba(14,14,14,0.14); transform: rotate(' + k.r + 'deg);',
        sw: 'aspect-ratio: 1 / 1.15; background: ' + k.bg + '; border: 1px solid rgba(14,14,14,0.25);' })),
      apps: apps.map((a, i) => ({ ...a, tape: i % 2 ? 'tape2' : 'tape1',
        box: 'flex: 0 1 300px; min-width: 0; transform: rotate(' + a.r + 'deg);' + (i === 1 ? ' margin-top: clamp(0px, 4vw, 64px);' : '') }))
    };
  }
}
window.__DCComponent = Component;
</script>
